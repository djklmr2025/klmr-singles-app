name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Keystore
        shell: bash
        env:
          KS_B64: ${{ secrets.KS_B64 }}
        run: echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/klmr.p12"
      - name: Build
        shell: bash
        env:
          KS_PATH: ${{ runner.temp }}/klmr.p12
          KS_PASS: ${{ secrets.KS_PASS }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: gradle --no-daemon --stacktrace assembleRelease 2>&1 | tee build.log
      - name: Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk KLMR-Singles.apk
          gh release create "v1.0.${{ github.run_number }}" KLMR-Singles.apk --title "KLMR Singles 1.0.${{ github.run_number }}" --notes "APK firmado de KLMR Singles." --latest
      - name: Report failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          grep -E "^e: |error:|What went wrong|Execution failed|FAILURE|Caused by" -A4 build.log | head -90 > err.txt || true
          gh issue create --title "Build failed run ${{ github.run_number }}" --body-file err.txt
